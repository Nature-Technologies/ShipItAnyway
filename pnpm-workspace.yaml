packages:
  - frontend
  - backend
  - mcp-server

# Force patched versions of transitive deps flagged by `pnpm audit` (SSRF/DoS in URL/query parsers).
overrides:
  fast-uri@>=3.0.0 <3.1.6: '^3.1.6'
  deepmerge-ts@<8.0.0: '^8.0.0'
  qs@<6.16.0: '^6.16.0'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
