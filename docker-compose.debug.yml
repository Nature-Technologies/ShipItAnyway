# DEBUG environment — peer of docker-compose.override.yml (do NOT stack both).
# Run with an explicit -f list, which disables the auto-loaded override.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up --build
#
# Differences from override.yml (prod-style):
#   - backend/frontend build the `dev` Dockerfile targets (tsx watch / vite dev)
#   - source dirs are bind-mounted, so host edits restart each process live
#   - backend exposes the Node inspector on 9229 for VS Code attach
# See .vscode/launch.json for the matching debug configurations.

x-backend-env: &backend-env
  BACKEND_PORT: ${BACKEND_PORT:-3000}
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/playwright_testing
  REDIS_HOST: redis
  REDIS_PORT: ${REDIS_PORT:-6379}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_HOST_PORT:-5173}}
  FRONTEND_INTERNAL_URL: ${FRONTEND_INTERNAL_URL:-http://frontend:5173}
  SCREENSHOTS_DIR: /app/backend/screenshots
  TRACES_DIR: /app/backend/traces
  FIXTURES_DIR: /app/backend/fixtures
  TZ: UTC
  DISPLAY: ":99"
  NOVNC_HOST: novnc
  # Force container Chromium; wins over env_file's host PLAYWRIGHT_BROWSERS_PATH (a Windows path)
  PLAYWRIGHT_BROWSERS_PATH: "0"
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shipitanyway.app}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
  NODE_ENV: development

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
      - "9229:9229"
    # env_file supplies SMTP_* / APP_URL from the host root .env; the anchor's
    # explicit `environment:` keys still win over any duplicates here.
    env_file:
      - .env
    environment: *backend-env
    volumes:
      # Live source; anonymous volume keeps the container's Linux node_modules
      # instead of shadowing it with the host's.
      - ./backend:/app/backend
      - /app/backend/node_modules
      - screenshots:/app/backend/screenshots
      - traces:/app/backend/traces
      - fixtures:/app/backend/fixtures
      - x11_socket:/tmp/.X11-unix
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      novnc:
        condition: service_healthy
    shm_size: '1gb'
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${BACKEND_PORT:-3000}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    environment:
      # Browser reaches the backend on the host-mapped port; CORS allows :5173.
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:${BACKEND_HOST_PORT:-3000}}
      VITE_NOVNC_URL: ${VITE_NOVNC_URL:-http://localhost:${NOVNC_HOST_PORT:-6080}}
      FRONTEND_PORT: 5173
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy

