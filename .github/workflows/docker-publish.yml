name: Publish Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag for manual publish
        required: true
        default: edge

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
  IMAGE_VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: wrighttest-backend
            context: .
            dockerfile: backend/Dockerfile
          - name: frontend
            image: wrighttest-frontend
            context: .
            dockerfile: frontend/Dockerfile
          - name: novnc
            image: wrighttest-novnc
            context: ./novnc
            dockerfile: ./novnc/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=WrightTest ${{ matrix.name }}
            org.opencontainers.image.description=Low-code Playwright UI testing platform component.
            org.opencontainers.image.url=https://wrighttest.com
            org.opencontainers.image.source=https://github.com/AlexFilippov-it/wrighttest
            org.opencontainers.image.documentation=https://github.com/AlexFilippov-it/wrighttest#readme
            org.opencontainers.image.licenses=WrightTest Source-Available License v1.0

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
