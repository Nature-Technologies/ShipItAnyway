services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playwright_testing
    # Bind published ports to loopback by default so the DB is never internet-reachable.
    # Containers reach each other over the compose network (service DNS), not these host ports.
    # For production, prefer not publishing at all; override HOST_BIND only behind a trusted network.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d playwright_testing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  novnc:
    build:
      context: ./novnc
      dockerfile: Dockerfile
    restart: unless-stopped
    # noVNC/VNC give full control of the live browser — never expose publicly.
    # Loopback-only by default; put behind the authenticated reverse proxy for remote access.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${VNC_HOST_PORT:-5900}:5900"
      - "${HOST_BIND:-127.0.0.1}:${NOVNC_HOST_PORT:-6080}:6080"
    environment:
      VNC_PORT: ${VNC_PORT:-5900}
      NOVNC_PORT: ${NOVNC_PORT:-6080}
    volumes:
      - x11_socket:/tmp/.X11-unix
    shm_size: '256mb'
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${NOVNC_PORT:-6080}/vnc.html >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  screenshots:
  traces:
  fixtures:
  x11_socket:
